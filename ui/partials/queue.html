    <dialog class="queue-panel" id="queue-dialog" aria-labelledby="queue-title">
      <div class="queue-heading"><h2 id="queue-title">Queue</h2><div class="queue-dialog-actions"><span class="help-control"><button class="secondary" id="pause-queue" type="button">Pause queue</button><button type="button" class="help-button" aria-label="Help with Pause queue" data-help="Pauses or resumes ordinary queued work. The active batch finishes, and Generate immediately requests can still run."><span aria-hidden="true">?</span></button></span><span class="help-control"><button class="secondary" id="clear-queue" type="button">Clear waiting</button><button type="button" class="help-button" aria-label="Help with Clear waiting" data-help="Cancels all waiting jobs across models. The active batch, completed images and job history are kept."><span aria-hidden="true">?</span></button></span><button class="secondary" id="close-queue" type="button" aria-label="Close queue">Close</button></div></div><p class="queue-count" id="queue-summary" role="status">Connecting…</p>
      <p class="queue-help">Saved on disk and resumed after a server restart. One queue handles all setup image models.</p><p class="queue-help" id="queue-drag-help">Drag the grip on the left to reorder waiting jobs, or focus it and use ↑ / ↓. Run Now uses the next free slot without interrupting the active batch.</p>
      <div class="queue-tools"><label for="queue-filter" style="margin:0">Show</label><button type="button" class="help-button" aria-label="Help with queue filter" data-help="Show active work or filter saved history by job status. All models share this queue and its ordering."><span aria-hidden="true">?</span></button><select id="queue-filter"><option value="pending">Active queue</option><option value="">All jobs</option><option value="queued">Waiting</option><option value="running">Running</option><option value="succeeded">Completed</option><option value="failed">Failed</option><option value="cancelled">Cancelled</option></select></div>
      <p class="queue-help" id="queue-notice" role="status" hidden></p><div class="queue-list" id="queue-list" aria-live="polite"></div>
      <p class="error" id="queue-error" role="alert" hidden></p><div class="queue-pages"><button class="secondary" id="queue-previous" type="button" disabled>← Previous</button><span class="queue-count" id="queue-page"></span><button class="secondary" id="queue-next" type="button" disabled>Next →</button></div>
    </dialog>
